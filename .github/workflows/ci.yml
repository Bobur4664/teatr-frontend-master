# Build and verify every theatre site. Nothing here talks to the production host.
# Branch protection requires the single `ci-ok` job.

name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [buxoro, berdax, kukla, kattakurgan, yoshtomoshabinlar]
    name: site (${{ matrix.site }})
    env:
      SITE_DIR: .site-build
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: scripts/assemble-site.sh "${{ matrix.site }}" "$SITE_DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Typecheck
        working-directory: ${{ env.SITE_DIR }}
        run: |
          npm ci --no-audit --no-fund
          npm run lint

      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SITE_DIR }}
          load: true
          tags: ci/${{ matrix.site }}-frontend
          cache-from: type=gha,scope=${{ matrix.site }}-frontend
          cache-to: type=gha,mode=max,scope=${{ matrix.site }}-frontend
      - name: Smoke test container
        run: |
          docker run -d --name fe -p 13001:3001 ci/${{ matrix.site }}-frontend
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13001/api/health || true)
            case "$code" in 2??|3??) echo "healthy: $code"; exit 0;; esac
            sleep 2
          done
          echo "never became healthy (last status: $code)"
          docker logs fe
          exit 1

  # Single required check for branch protection.
  ci-ok:
    if: always()
    needs: [site]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All sites passed."
